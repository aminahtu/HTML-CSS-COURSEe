<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube.com Clone</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/general1.css" />
    <link rel="stylesheet" href="styles/header1.css" />
    <link rel="stylesheet" href="styles/video1.css" />
    <link rel="stylesheet" href="styles/sidebar1.css" />
    <link rel="stylesheet" href="styles/button-container.css" />
  </head>
  <body>
    <header class="header">
      <div class="left-section">
        <img class="hamburger-menu" src="icons/hamburger-menu.svg" />
        <img class="youtube-logo" src="icons/youtube-logo.svg" />
        <span class="country-code">NG</span>
      </div>
      <div class="middle-section">
        <input class="search-bar" type="text" placeholder="Search" />
        <button class="search-button">
          <img class="search-icon" src="icons/search.svg" />
          <div class="tooltip">Search</div>
        </button>
        <button class="voice-search-button">
          <img class="voice-search-icon" src="icons/voice-search-icon.svg" />
          <div class="tooltip">Search with your voice</div>
        </button>
      </div>
      <div class="right-section">
        <div>
            
          <button class="create-btn"> <img src="icons/plus (1).svg" class="plus-icon"/> Create</button>
        </div>
        <div class="notifications-icon-container">
          <img class="notifications-icon" src="icons/notifications.svg" />
          <div class="notifications-count">3</div>
        </div>
        <img
          class="current-user-picture"
          src="channel-pictures/my-channel.jpeg"
        />
      </div>
      <div class="buttom-section">
      <div class="btn-container">
          <div class="chip-bar" >
            <button class="chip active" data-category="All">All</button>
            <button class="chip" data-category="Entertainment">Entertainment</button>
            <button class="chip" data-category="Science">Science</button>
            <button class="chip" data-category="Mathematics">Mathematics</button>
            <button class="chip" data-category="Culinary">Culinary</button>
            <button class="chip" data-category="Technology">Technology</button>
            <button class="chip" data-category="Fitness">Fitness</button>
            <button class="chip" data-category="Aviation">Aviation</button>
            <button class="chip" data-category="Education">Education</button>
            <button class="chip" data-category="Comedy">Comedy</button>
            <button class="chip" data-category="Interview">Interview</button>
            <button class="chip" data-category="Fitness">Fitness</button>
            <button class="chip" data-category="Science">Science</button>
            <button class="chip" data-category="Mathematics">Mathematics</button>
            <button class="chip" data-category="Culinary">Culinary</button>
            <button class="chip" data-category="Gaming">Gaming</button>
            <button class="chip" data-category="Comedy">Comedy</button>
          </div>
        </div>
      </div>
    </header>

    <div class="side-bar" id="sideBar">
      <div class="side-bar-section">
        <a href="#" class="side-bar-link active">
          <img class="side-bar-icon" src="icons/home.svg" />
          <div>Home</div>
        </a>
        <a href="#" class="side-bar-link">
          <img class="side-bar-icon" src="icons/shhh.svg" />
          <div>Shorts</div>
        </a>
        <a href="#" class="side-bar-link">
          <img class="side-bar-icon" src="icons/subscriptions.svg" />
          <div>Subscriptions</div>
        </a>
      </div>

      <hr />

      <div class="side-bar-section">
        <a href="#" class="side-bar-link">
          <img class="side-bar-icon" src="icons/library.svg" />
          <div>Library</div>
        </a>
        <a href="#" class="side-bar-link">
          <img class="side-bar-icon" src="icons/history.svg" />
          <div>History</div>
        </a>
        <a href="#" class="side-bar-link">
          <img class="side-bar-icon" src="icons/list-video.svg" />
          <div>Your videos</div>
        </a>
        <a href="#" class="side-bar-link">
          <img class="side-bar-icon" src="icons/clock.svg" />
          <div>Watch later</div>
        </a>
        <a href="#" class="side-bar-link">
          <img class="side-bar-icon" src="icons/thumbs-up.svg" />
          <div>Liked videos</div>
        </a>
      </div>

      <hr />

      <div class="side-bar-section">
        <div class="side-bar-section-title">Explore</div>
        <a href="#" class="side-bar-link">
          <img class="side-bar-icon" src="icons/trending.svg" />
          <div>Trending</div>
        </a>
        <a href="#" class="side-bar-link">
          <img class="side-bar-icon" src="icons/music.svg" />
          <div>Music</div>
        </a>
        <a href="#" class="side-bar-link">
          <img class="side-bar-icon" src="icons/gaming.svg" />
          <div>Gaming</div>
        </a>
        <a href="#" class="side-bar-link">
          <img class="side-bar-icon" src="icons/news.svg" />
          <div>News</div>
        </a>
      </div>
    </div>

    <main>
      <div class="main-content">
        <section class="video-grid" id="videoGrid">
        </section>
      </div>
    </main>
    <script defer src="styles/main.js"></script>
  </body>
</html>
